[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "action-recognition"
version = "1.0.0"
description = "Real-Time Action Recognition System with Human Pose Estimation"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "wandb>=0.15.0",
    "tensorboard>=2.13.0",
]

[project.optional-dependencies]
serving = ["fastapi>=0.100.0", "uvicorn>=0.23.0", "pydantic>=2.0.0"]
viz = ["torchviz>=0.0.2"]
dev = ["pytest>=7.0", "black>=23.0", "flake8>=6.0", "mypy>=1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
